on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Migrate Database
        run: npm run db:migrate

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Build and Push to Google Artifact Registry'
        run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-501100/notely-ar-repo/notely:latest'

      - name: Deploy to Cloud Run
        run: 'gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-501100/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-501100 --max-instances=4'

